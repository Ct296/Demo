<div th:fragment="default" id="chatbot-root">
    <button id="chatbot-toggle" type="button" aria-label="Mở chatbot">💬</button>

    <div id="chatbot-box" class="chatbot-hidden">
        <div class="chatbot-header">
            <div>
                <strong>ITHotel Assistant</strong>
                <div class="chatbot-subtitle">Hỗ trợ đặt phòng, cọc, thanh toán, chính sách</div>
            </div>
            <button id="chatbot-close" type="button">✕</button>
        </div>

        <div id="chatbot-messages" class="chatbot-messages">
            <div class="chatbot-message bot">
                Xin chào! Mình có thể hỗ trợ thông tin về đặt phòng, tiền cọc, thanh toán và chính sách.
            </div>
        </div>

        <div class="chatbot-input-area">
            <textarea id="chatbot-input" rows="2" maxlength="500" placeholder="Nhập câu hỏi của bạn..."></textarea>
            <button id="chatbot-send" type="button">Gửi</button>
        </div>
    </div>
</div>
