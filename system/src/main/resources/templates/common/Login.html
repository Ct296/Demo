<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/CustomerLayout :: head-content}"></head>
<body class="bg-light">

<nav th:replace="~{common/CustomerLayout :: header}"></nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                            <i class="fas fa-user-lock fa-2x"></i>
                        </div>
                        <h3 class="fw-bold">Đăng nhập</h3>
                        <p class="text-muted">Chào mừng bạn quay lại ITHotel</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger text-center small" th:text="${error}"></div>
                    <div th:if="${message}" class="alert alert-success text-center small" th:text="${message}"></div>

                    <form th:action="@{/login}" method="post" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email"
                                       name="email"
                                       class="form-control"
                                       placeholder="Nhập email của bạn"
                                       th:value="${enteredEmail}"
                                       autocomplete="username"
                                       required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password"
                                       name="password"
                                       id="loginPassword"
                                       class="form-control"
                                       placeholder="Nhập mật khẩu"
                                       autocomplete="current-password"
                                       required>
                                <button type="button" class="btn btn-outline-secondary toggle-password" data-target="loginPassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                            ĐĂNG NHẬP <i class="fas fa-sign-in-alt ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="small text-muted mb-0">Chưa có tài khoản? <a th:href="@{/register}" class="text-primary fw-bold text-decoration-none">Đăng ký ngay</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{common/CustomerLayout :: footer}"></footer>
<script th:src="@{/js/common/toggle-password.js}"></script>
<script>
    (function () {
        function isBackForwardNavigation() {
            try {
                var entries = window.performance && window.performance.getEntriesByType
                    ? window.performance.getEntriesByType('navigation')
                    : [];

                if (entries && entries.length > 0) {
                    return entries[0].type === 'back_forward';
                }

                if (window.performance && typeof window.performance.navigation !== 'undefined') {
                    return window.performance.navigation.type === 2;
                }
            } catch (e) {
                console.warn('Không xác định được navigation type.', e);
            }
            return false;
        }

        window.addEventListener('pageshow', function (event) {
            if (event.persisted || isBackForwardNavigation()) {
                window.location.reload();
            }
        });
    })();
</script>

</body>
</html>
